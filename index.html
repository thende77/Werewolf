<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14161f">
    <meta name="description" content="A reference guide for Werewolf roles.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Werewolf Roles</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./werewolf.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="./werewolf.jpg">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="list-view">
        <header class="site-header">
            <div class="header-inner">
                <div>
                    <h1 id="page-title">Werewolf Roles</h1>
                    <p class="subtitle" id="page-sub">Tap a role to view abilities</p>
                </div>
            </div>
        </header>

        <main class="page-content">
            <section class="controls" aria-label="Role search and filters">
                <label class="search-wrap">
                    <span class="sr-only">Search roles</span>
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <input id="search" type="search" placeholder="Search roles..." autocomplete="off">
                    <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
                </label>

                <div class="filter-row">
                    <label class="filter-label" for="team-filter">Team</label>
                    <select id="team-filter">
                        <option value="all">All teams</option>
                        <option value="village">Village</option>
                        <option value="wolf">Werewolf</option>
                        <option value="solo">Solo</option>
                        <option value="alien">Alien</option>
                        <option value="variable">Variable / unknown</option>
                    </select>
                </div>

                <div class="filter-row">
                    <label class="filter-label" for="group-filter">Expansion</label>
                    <select id="group-filter">
                        <option value="all">All expansions</option>
                    </select>
                </div>
            </section>

            <p id="result-count" class="result-count" aria-live="polite"></p>
            <section id="roles" aria-label="Werewolf roles"></section>
            <p id="empty-state" class="empty-state" hidden>No roles match your search.</p>
        </main>
    </div>

    <div id="detail-view" class="hidden">
        <header class="detail-header">
            <div class="detail-header-inner">
                <button id="back" class="back-button" type="button">← <span>Back to roles</span></button>
            </div>
        </header>

        <main class="page-content detail-content">
            <p id="detail-group" class="detail-group"></p>
            <h1 id="detail-name"></h1>

            <div class="detail-meta">
                <span id="detail-team" class="team-pill"></span>
                <span id="detail-timing" class="timing-pill hidden"></span>
            </div>

            <section class="detail-section">
                <h2>Description</h2>
                <p id="detail-description"></p>
            </section>

            <section id="ability-section" class="detail-section hidden">
                <h2>Ability</h2>
                <p id="detail-ability"></p>
            </section>

            <section id="win-section" class="detail-section hidden">
                <h2>Win condition</h2>
                <p id="detail-win"></p>
            </section>

            <section id="tip-section" class="detail-section tip-section hidden">
                <h2>Strategy tip</h2>
                <p id="detail-tip"></p>
            </section>
        </main>
    </div>

    <script src="./roles.js"></script>
    <script src="./app.js"></script>
</body>
</html>
